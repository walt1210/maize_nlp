steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/maize-nlp', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/maize-nlp']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maize-nlp'
      - '--image=gcr.io/$PROJECT_ID/maize-nlp'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=120'
      - '--max-instances=1'
      # max-instances=1 is a deliberate thesis-scope workaround: in-memory
      # chatbot sessions have no cross-instance affinity on Cloud Run, so
      # capping at one instance avoids a /chat follow-up landing on an
      # instance that never saw the original /diagnose session. This trades
      # away concurrency — fine for a thesis demo, not for real scale.
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,MAIZE_API_KEY=maize-api-key:latest'
