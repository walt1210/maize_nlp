steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/maize-nlp', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/maize-nlp']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maize-nlp'
      - '--image=gcr.io/$PROJECT_ID/maize-nlp'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=180'
      # Bumped from the original 512Mi/1cpu/120s: the server now loads a
      # full PyTorch Student model (torch + segmentation-models-pytorch)
      # for server-side XAI/segmentation overlay generation, since TFLite
      # can't run gradient-based methods like Grad-CAM++. CPU-only
      # inference for one image is real added latency (model load is a
      # one-time cost per container instance, but the forward pass +
      # Score-CAM/Grad-CAM++ computation happens every /diagnose call) 
      # these values are a starting point, not tuned; benchmark and
      # adjust once the actual checkpoint is bundled.
      - '--max-instances=1'
      # max-instances=1 is a deliberate thesis-scope workaround: in-memory
      # chatbot sessions have no cross-instance affinity on Cloud Run, so
      # capping at one instance avoids a /chat follow-up landing on an
      # instance that never saw the original /diagnose session. This trades
      # away concurrency - fine for a thesis demo, not for real scale.
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,MAIZE_API_KEY=maize-api-key:latest'


